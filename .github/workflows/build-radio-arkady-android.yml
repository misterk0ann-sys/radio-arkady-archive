             άγνωστων εφαρμογών για τον browser ή το Files.
          4. Πάτησε Εγκατάσταση.

          Η εφαρμογή φορτώνει:
          https://radioarkadyfans.weebly.com/
          EOF

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RADIO-ARKADY-FANS-ANDROID
          path: |
            android-download/RADIO-ARKADY-FANS.apk
            android-download/RADIO-ARKADY-FANS.apk.sha256
            android-download/INSTALL.txt
          retention-days: 90

      - name: Commit APK to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android-download

          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Build RADIO ARKADY Android app"
            git push
          fi
