      - name: Build installable APK
        working-directory: radio-arkady-android
        shell: bash
        run: |
          gradle --version
          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Prepare download files
        shell: bash
        run: |
          mkdir -p android-download

          cp             radio-arkady-android/app/build/outputs/apk/release/app-release.apk             android-download/RADIO-ARKADY-FANS.apk

          sha256sum             android-download/RADIO-ARKADY-FANS.apk             > android-download/RADIO-ARKADY-FANS.apk.sha256

          cat > android-download/INSTALL.txt <<'EOF'
          RADIO ARKADY FANS — Android App 1.0

          Αρχείο:
          RADIO-ARKADY-FANS.apk

          Εγκατάσταση:
          1. Κατέβασε το APK στο Android κινητό.
          2. Άνοιξέ το από τις Λήψεις.
